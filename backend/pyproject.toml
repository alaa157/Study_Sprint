[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "studysprint"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]",
  "sqlalchemy==2.0.*",
  "alembic",
  "pydantic>=2.0",
  "pydantic-settings",
  "pyjwt",
  "email-validator",
  "passlib[bcrypt]",
  "psycopg[binary]",
  "httpx",
  "pytest",
]